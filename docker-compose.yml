services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-task3-prototype}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-task3}:${POSTGRES_PASSWORD:-task3}@postgres:5432/${POSTGRES_DB:-task3}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task3}
      POSTGRES_USER: ${POSTGRES_USER:-task3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task3}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-task3} -d ${POSTGRES_DB:-task3}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
